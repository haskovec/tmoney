# Runs the tests and the linter on every pull request and on each push to
# main. The tools come from mise.toml (the pinned Go and golangci-lint), the
# same as `mise run test` on a dev machine.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run that is still going for it.
# Runs on main are never cancelled, so every merged commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs and caches the tools in mise.toml. The DuckDB bindings are
      # cgo; the runner's gcc builds them, and mise.toml sets CGO_ENABLED=1.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Find the Go caches
        id: go-env
        run: |
          echo "modcache=$(mise exec -- go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "buildcache=$(mise exec -- go env GOCACHE)" >> "$GITHUB_OUTPUT"

      # The module cache (large: the DuckDB bindings) changes only with
      # go.sum, so it keeps one key. A saved key is never written again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gomod-${{ runner.os }}-

      # The build and lint caches change with the code, so each commit saves
      # a fresh copy and the restore keys find the newest one. GitHub evicts
      # old entries past the repo's cache size limit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.buildcache }}
            ~/.cache/golangci-lint
          key: gobuild-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-
            gobuild-${{ runner.os }}-

      - name: Test
        id: test
        run: mise run test

      # Lint runs after failed tests too, so one run reports both; it is left
      # out only when the tests did not run (a setup step failed).
      - name: Lint
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: mise exec -- golangci-lint run ./...
