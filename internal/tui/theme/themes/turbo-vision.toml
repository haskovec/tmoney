# TMoney Turbo Vision theme — Borland TV aesthetic. Blue windows with
# yellow titles, light-gray menu/status bars with red shortcut letters,
# and double-line borders throughout.

name = "Turbo Vision"
description = "Classic Borland Turbo Vision blue + double borders"

border_style = "double"

# Desktop — solid blue fill behind the main content area and sidebar,
# matching the original Turbo Vision look. Empty cells (short content
# rows, gaps below content) paint blue rather than showing terminal
# default.
desktop.bg = "#0000aa"

# Menu bar — black on light gray, with red shortcut letters (no underline).
menubar.fg = "#000000"
menubar.bg = "#aaaaaa"
menubar.active.fg = "#ffffff"
menubar.active.bg = "#000000"
menubar.shortcut.fg = "#aa0000"
menubar.shortcut.underline = false

# Status bar — same chrome as the menu bar.
statusbar.fg = "#000000"
statusbar.bg = "#aaaaaa"
statusbar.shortcut.fg = "#aa0000"
statusbar.shortcut.underline = false

# Windows — Turbo Vision blue with yellow titles and white borders.
window.bg = "#0000aa"
window.fg = "#aaaaaa"
window.border.fg = "#ffffff"
window.title.fg = "#ffff55"

# Dialogs — black on light gray, dark borders. Action buttons render
# as classic Borland green: black text on green for unfocused buttons.
# The focused button is bright green, with its first letter in the red
# of the menu shortcuts. Borland's focused button kept the green and
# had white text with a yellow letter, but those have low contrast on
# green (3.1:1 and 2.9:1). Terminals with a "minimum contrast" setting
# (Rex, Ghostty, iTerm2) made that text dark, and then the focused
# button looked like the others. A terminal does not change a
# background color, so the focus shows in each terminal.
dialog.bg = "#aaaaaa"
dialog.fg = "#000000"
dialog.border.fg = "#000000"
dialog.title.fg = "#000000"
dialog.button.fg = "#000000"
dialog.button.bg = "#00aa00"
dialog.button.focused.fg = "#000000"
dialog.button.focused.bg = "#55ff55"
dialog.button.shortcut.fg = "#aa0000"

# Tables — yellow headers, black-on-cyan selected row.
table.header.fg = "#ffff55"
table.row.fg = "#aaaaaa"
table.selected.fg = "#000000"
table.selected.bg = "#00aaaa"

# Semantic text — bright variants typical of TV.
text.positive = "#55ff55"
text.negative = "#ff5555"
text.alert = "#ffff55"
text.muted = "#5555ff"
text.title = "#ffffff"
text.error = "#ff5555"

# Symbols.
symbols.menu_separator = " │ "
symbols.focus_indicator = "▶ "
symbols.checkmark = "✓"
