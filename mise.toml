# Development toolchain for tmoney. On a fresh clone:
#
#   mise trust     # mise refuses to read an untrusted config, so this is first
#   mise install   # fetch the pinned tools
#
# `mise install` only downloads the tools; it does not put them on PATH. Add
# `eval "$(mise activate zsh)"` (or the bash/fish form) to your shell profile,
# or prefix one-off commands with `mise exec --`. `mise doctor` diagnoses a
# tool that still does not appear.
#
# mise does NOT provide the C compiler the DuckDB cgo bindings need. Install
# that from the platform: Xcode command line tools on macOS
# (`xcode-select --install`), build-essential on Debian/Ubuntu, or the MSYS2
# toolchain on Windows.
min_version = "2025.1.0"

[tools]
# Keep this major.minor in step with the `go` directive in go.mod. The prefix
# picks up the newest 1.27.x patch, which only carries bug and security fixes.
go = "1.27"

golangci-lint = "2.14"

[env]
# The DuckDB bindings are cgo, so cgo must stay on. Go enables it by default
# for native builds, but only when it finds a C compiler — being explicit turns
# a silent fallback to a pure-Go build into a loud compiler error. The Makefile
# exports the same value for `make` recipes; this covers bare `go build` and
# `go test` runs in this directory.
CGO_ENABLED = "1"

# `mise run build` and `mise run test` do the same as `make build` and
# `make test`, with the pinned Go from [tools] and CGO_ENABLED from [env].
[tasks.build]
description = "Build the tmoney binary"
run = "go build -o tmoney ."
run_windows = "go build -o tmoney.exe ."

[tasks.test]
description = "Run all tests"
# -p 8: packages run in parallel; each test isolates its own DB/config.
run = "go test -p 8 ./..."
